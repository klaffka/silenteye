name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qtbase qtmultimedia qca

      - name: Configure
        env:
          ENABLE_MODULE: "1"
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package application bundle
        run: |
          set -euo pipefail
          APP="build/silenteye.app"
          cp build/libsef.dylib "$APP/Contents/MacOS/"

          # macOS intentionally ships without the AES plug-ins. Homebrew's QCA
          # keeps a compiled-in provider directory pointing at its own install
          # location, so bundling it would make QCA load a second, mismatching
          # provider on systems that have QCA installed and crash. The BMP/JPEG/
          # WAV modules cover the steganography features. AES is available in
          # the Windows bundle and in source builds that link a system QCA.
          rm -f "$APP/Contents/MacOS/modules/libsecryptoaes.dylib" \
                "$APP/Contents/MacOS/modules/libsecryptoaes256.dylib"

          # bundle the Qt runtime used by the executable and the format plug-ins
          EXTRA=""
          for lib in "$APP"/Contents/MacOS/modules/*.dylib; do
            EXTRA="$EXTRA -executable=$lib"
          done
          macdeployqt "$APP" -always-overwrite $EXTRA || true

          # macdeployqt rewrites install names (invalidating signatures), so
          # re-sign the whole bundle ad-hoc
          codesign --force --deep --sign - "$APP"
          codesign --verify "$APP"

          # no build-machine paths may remain in the bundle
          if otool -L "$APP/Contents/MacOS/silenteye" \
                     "$APP/Contents/MacOS/modules/"*.dylib | grep -q "/opt/homebrew"; then
            echo "ERROR: bundle still references Homebrew paths" >&2
            exit 1
          fi

          # plain zip (not `ditto -c -k`) so the archive works with every
          # extraction tool (unzip, Finder, 7z, Windows). `-y` keeps the
          # framework symlinks as links instead of duplicating the payload.
          # Note: macOS stores the ad-hoc signature of plain data files
          # (.conf, .xml) in extended attributes, which no zip format
          # survives - this is expected and does not affect runtime.
          (cd build && zip -r -X -y -q ../silenteye-macos-arm64.zip silenteye.app)
          ls -lh silenteye-macos-arm64.zip

          # guard: the archive must round-trip through `unzip` and the app
          # must actually run from the extracted bundle
          TESTDIR="$(mktemp -d)"
          unzip -q silenteye-macos-arm64.zip -d "$TESTDIR"
          BIN="$TESTDIR/silenteye.app/Contents/MacOS/silenteye"
          T="$TESTDIR/run"; CONF="$T/conf"; OUT="$T/out"; mkdir -p "$CONF" "$OUT"
          python3 - "$T/test.bmp" <<'PY'
import struct, sys
w = h = 256
row = b''.join(bytes((x % 256, (x * 3) % 256, (x * 7) % 256)) for x in range(w))
row += b'\x00' * ((4 - (w * 3) % 4) % 4)
pixels = row * h
size = 54 + len(pixels)
with open(sys.argv[1], 'wb') as f:
    f.write(b'BM' + struct.pack('<IHHI', size, 0, 0, 54))
    f.write(struct.pack('<IiiHHIIiiII', 40, w, h, 1, 24, 0, len(pixels), 2835, 2835, 0, 0))
    f.write(pixels)
PY
          sed -e 's#<imageformat>JPEG</imageformat>#<imageformat>BMP</imageformat>#' \
              -e "s#<output></output>#<output>$OUT/</output>#" \
              silenteye.conf > "$CONF/silenteye.conf"
          "$BIN" --batch encode "$T/test.bmp" --message "release-smoke" --confpath "$CONF"
          "$BIN" --batch decode "$OUT/test.bmp" --confpath "$CONF" 2>&1 | grep -q "Decoded message: release-smoke"
          echo "unzip round-trip smoke test passed"
          rm -rf "$TESTDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: silenteye-macos-arm64
          path: silenteye-macos-arm64.zip

  # ---------------------------------------------------------------------------
  # Windows (x64, MSYS2/MinGW)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qca-qt6
            zip

      - name: Configure
        run: ENABLE_MODULE=1 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package application
        run: |
          set -euo pipefail
          DIST="dist/silenteye"
          rm -rf dist
          mkdir -p "$DIST/modules" "$DIST/crypto"

          cp build/silenteye.exe          "$DIST/"
          cp build/libsef.dll             "$DIST/"
          cp build/*.conf build/version.xml "$DIST/"
          cp build/modules/*.dll          "$DIST/modules/"

          # QCA runtime + crypto provider plug-ins
          cp /mingw64/bin/libqca-qt6*.dll "$DIST/" || true
          cp /mingw64/share/qt6/plugins/crypto/*.dll "$DIST/crypto/" || true
          cp /mingw64/bin/libssl-*.dll /mingw64/bin/libcrypto-*.dll "$DIST/" || true

          # make Qt look for plug-ins next to the executable as well
          printf '[Paths]\nPlugins = .\n' > "$DIST/qt.conf"

          # deploy the Qt runtime
          if command -v windeployqt6 >/dev/null 2>&1; then WD=windeployqt6; else WD=windeployqt; fi
          "$WD" --release --no-translations --no-compiler-runtime "$DIST/silenteye.exe"

          cd dist && zip -r ../silenteye-windows-x64.zip silenteye
          ls -lh ../silenteye-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: silenteye-windows-x64
          path: silenteye-windows-x64.zip

  # ---------------------------------------------------------------------------
  # Publish a GitHub release with all binaries
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [macos, windows]
    # only publish for real tags; workflow_dispatch is used to dry-run the
    # packaging jobs without creating a release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: find artifacts -type f -maxdepth 2 -exec ls -lh {} \;

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
