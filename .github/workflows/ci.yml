name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon) - full build, tests and batch-mode smoke test
  # ---------------------------------------------------------------------------
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qtbase qtmultimedia qca

      - name: Configure
        env:
          ENABLE_MODULE: "1"
          ENABLE_TESTSUITE: "1"
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Tests (informational)
        # The JPEG suite contains known, pre-existing failures for the BOTTOM
        # header position on the tiny repository fixtures; they must not block
        # the build.
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure

      - name: Batch-mode smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          BIN="$PWD/build/silenteye.app/Contents/MacOS/silenteye"
          WORK="$(mktemp -d)"
          CONF="$WORK/conf"
          OUT="$WORK/out"
          mkdir -p "$CONF" "$OUT"

          # generate a 256x256 24-bit BMP without external tools
          python3 - "$WORK/test.bmp" <<'PY'
          import struct, sys
          w = h = 256
          row = b''.join(bytes((x % 256, (x * 3) % 256, (x * 7) % 256)) for x in range(w))
          pad = (4 - (w * 3) % 4) % 4
          row += b'\x00' * pad
          pixels = row * h
          size = 54 + len(pixels)
          with open(sys.argv[1], 'wb') as f:
              f.write(b'BM' + struct.pack('<IHHI', size, 0, 0, 54))
              f.write(struct.pack('<IiiHHIIiiII', 40, w, h, 1, 24, 0, len(pixels), 2835, 2835, 0, 0))
              f.write(pixels)
          PY

          sed -e 's#<imageformat>JPEG</imageformat>#<imageformat>BMP</imageformat>#' \
              -e "s#<output></output>#<output>$OUT/</output>#" \
              silenteye.conf > "$CONF/silenteye.conf"

          echo "::group::plain message round-trip"
          "$BIN" --batch encode "$WORK/test.bmp" --message "ci-plain-ok" --confpath "$CONF"
          "$BIN" --batch decode "$OUT/test.bmp" --confpath "$CONF" | tee "$WORK/decode.log"
          grep -q "ci-plain-ok" "$WORK/decode.log"
          echo "::endgroup::"

          echo "::group::AES256 encrypted round-trip"
          "$BIN" --batch encode "$WORK/test.bmp" --message "ci-secret-ok" --password "s3cr3t" --confpath "$CONF"
          "$BIN" --batch decode "$OUT/test.bmp" --password "s3cr3t" --confpath "$CONF" | tee "$WORK/decode2.log"
          grep -q "ci-secret-ok" "$WORK/decode2.log"
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Windows (x64, MSYS2/MinGW) - full build with plugins
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 (MSYS2 MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qca-qt6

      - name: Configure
        run: ENABLE_MODULE=1 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  # ---------------------------------------------------------------------------
  # Linux - core compile check (modules need an extra Qt6 QCA build)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 (compile check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            qt6-base-dev qt6-multimedia-dev qt6-5compat-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
